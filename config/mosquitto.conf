# 本地演示用的最小配置。
# 注意：接 ESP32-S3 时必须监听 0.0.0.0（板子从 LAN 连进来），
# 只监听 127.0.0.1 的话手机/开发板永远连不上。
#
# 安全提示：allow_anonymous 只适合隔离的演示局域网。要改认证就设
#   allow_anonymous false
#   password_file ./config/mosquitto.passwd
# 然后 `mosquitto_passwd -c config/mosquitto.passwd <用户名>`。
listener 1883 0.0.0.0
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# 可选：WebSocket 监听（浏览器直连 MQTT 时用）
# listener 9001
# protocol websockets
